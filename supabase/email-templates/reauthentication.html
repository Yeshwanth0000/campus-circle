<div style="background-color:#f4f4f7;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
    <tr>
      <td style="background-color:#4f46e5;padding:20px 32px;">
        <span style="color:#ffffff;font-size:18px;font-weight:700;letter-spacing:-0.02em;">CampusBin</span>
      </td>
    </tr>
    <tr>
      <td style="padding:32px;">
        <h2 style="margin:0 0 12px;color:#111827;font-size:20px;">Confirm it's you</h2>
        <p style="margin:0 0 20px;color:#4b5563;font-size:15px;line-height:1.6;">Enter this code to verify your identity before continuing:</p>
        <div style="text-align:center;background-color:#eef2ff;border-radius:8px;padding:16px;margin:0 0 8px;">
          <span style="font-size:28px;font-weight:700;letter-spacing:0.15em;color:#4338ca;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">{{ .Token }}</span>
        </div>
        <p style="margin:0;color:#9ca3af;font-size:13px;line-height:1.5;">This code expires shortly. If you didn't try to do this, you can safely ignore this email.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px;border-top:1px solid #e5e7eb;">
        <p style="margin:0;color:#9ca3af;font-size:12px;">CampusBin — the marketplace for your campus.</p>
      </td>
    </tr>
  </table>
</div>
